# Blueprint Render : met en ligne le dossier public/ comme site (gratuit).
# Render → New → Blueprint → choisir ce dépôt GitHub → Apply.
services:
  - type: web
    name: suivi-carrosserie
    runtime: static
    buildCommand: echo "Pas de compilation nécessaire"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
