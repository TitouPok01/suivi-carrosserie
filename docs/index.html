<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi Carrosserie</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Suivi des véhicules en carrosserie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="atelier-name">Atelier carrosserie</h1><div class="top-r" id="top-r"></div></header>
  <div id="note"></div>
  <section class="alerts" id="alerts"></section>
  <main id="view"></main>
</div>
<div id="sheet-root"></div>
<div id="lb-root"></div>
<div id="toast-root"></div>
<div id="qc-root"></div>
<div id="pick-root"></div>
<div id="login-root"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js?v=10"></script>
<script src="app.js?v=10"></script>
<script>
if('serviceWorker' in navigator){
  // nouvelle version en ligne -> la tablette recharge toute seule
  let had=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}had=true});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    setInterval(()=>r.update().catch(()=>{}),15*60*1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
</body>
</html>
